    function normalize(value) {
      return String(value || "").toLowerCase().replace(/\s+/g, " ").trim();
    }

    function initialProgress() {
      return {
        activeLessonId: lessons[0].id,
        completed: {},
        submissions: {},
        showPandas: {}
      };
    }

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? { ...initialProgress(), ...JSON.parse(raw) } : initialProgress();
      } catch {
        return initialProgress();
      }
    }

    function App() {
      const [progress, setProgress] = React.useState(loadProgress);
      const [codeByLesson, setCodeByLesson] = React.useState(() => {
        const saved = loadProgress();
        return Object.fromEntries(lessons.map(lesson => [lesson.id, saved.submissions?.[lesson.id]?.code || ""]));
      });
      const [outputByLesson, setOutputByLesson] = React.useState({});
      const [hintIndex, setHintIndex] = React.useState(0);

      React.useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
      }, [progress]);

      const activeLesson = lessons.find(lesson => lesson.id === progress.activeLessonId) || lessons[0];
      const activeIndex = lessons.findIndex(lesson => lesson.id === activeLesson.id);
      const firstIncompleteIndex = lessons.findIndex(lesson => !progress.completed[lesson.id]);
      const lockIndex = firstIncompleteIndex === -1 ? lessons.length - 1 : firstIncompleteIndex;
      const completedCount = lessons.filter(lesson => progress.completed[lesson.id]).length;
      const percent = Math.round((completedCount / lessons.length) * 100);
      const code = codeByLesson[activeLesson.id] ?? "";
      const output = outputByLesson[activeLesson.id] || progress.submissions?.[activeLesson.id]?.output || "Run your Polars code to get feedback.";
      const currentPassed = Boolean(progress.completed[activeLesson.id]);
      const nextLocked = activeIndex < lessons.length - 1 && !currentPassed;
      const dataset = datasets[activeLesson.dataset];

      function lessonUnlocked(lesson) {
        return lessons.findIndex(item => item.id === lesson.id) <= lockIndex;
      }

      function selectLesson(lesson) {
        if (!lessonUnlocked(lesson)) {
          setOutputByLesson(prev => ({ ...prev, [activeLesson.id]: "Locked. Pass this lesson before jumping ahead." }));
          return;
        }
        setProgress(prev => ({ ...prev, activeLessonId: lesson.id }));
        setHintIndex(0);
      }

      function runLesson() {
        const text = normalize(code);
        const missing = activeLesson.checks.filter(check => !text.includes(normalize(check)));
        const passed = missing.length === 0;
        const result = [
          passed ? "Passed. Nice, unlock granted." : "Not yet.",
          "",
          passed ? activeLesson.expected : "Still missing: " + missing.join(", "),
          "",
          "This checker looks for the Polars patterns the lesson is teaching."
        ].join("\n");

        setOutputByLesson(prev => ({ ...prev, [activeLesson.id]: result }));
        setProgress(prev => ({
          ...prev,
          completed: { ...prev.completed, [activeLesson.id]: passed || prev.completed[activeLesson.id] },
          submissions: {
            ...prev.submissions,
            [activeLesson.id]: {
              code,
              output: result,
              passed,
              submittedAt: new Date().toISOString()
            }
          }
        }));
      }

      function nextLesson() {
        if (nextLocked) {
          setOutputByLesson(prev => ({ ...prev, [activeLesson.id]: "No skipping. Pass this lesson first, then Next unlocks." }));
          return;
        }
        const next = lessons[Math.min(activeIndex + 1, lessons.length - 1)];
        selectLesson(next);
      }

      function showPolarsAnswer() {
        setCodeByLesson(prev => ({ ...prev, [activeLesson.id]: activeLesson.polarsAnswer }));
        setOutputByLesson(prev => ({ ...prev, [activeLesson.id]: "Polars answer placed in the editor. Run it to pass." }));
      }

      function spoilPandas() {
        setProgress(prev => ({
          ...prev,
          showPandas: { ...prev.showPandas, [activeLesson.id]: !prev.showPandas?.[activeLesson.id] }
        }));
      }

      function resetCurrent() {
        setCodeByLesson(prev => ({ ...prev, [activeLesson.id]: "" }));
        setOutputByLesson(prev => ({ ...prev, [activeLesson.id]: "Editor cleared." }));
      }

      function resetAll() {
        const fresh = initialProgress();
        setProgress(fresh);
        setCodeByLesson(Object.fromEntries(lessons.map(lesson => [lesson.id, ""])));
        setOutputByLesson({});
        setHintIndex(0);
      }

      return (
        <div className="h-full bg-violetShell text-violetInk">
          <div className="flex h-full min-h-0">
            <aside className="hidden w-[360px] shrink-0 border-r border-violetLine bg-violetPanel/90 p-4 lg:flex lg:flex-col">
              <div className="mb-4">
                <div className="text-xs font-semibold uppercase tracking-[0.2em] text-violetMain">Polars Playground</div>
                <h1 className="mt-2 text-xl font-semibold tracking-tight">20-question data course</h1>
                <p className="mt-2 text-sm leading-6 text-violetMuted">Rockets, Shopify, Amazon, Uber, farms, and cows. Main path is pure Polars.</p>
              </div>

              <div className="rounded-lg border border-violetLine bg-violetSoft/60 p-3">
                <div className="flex items-center justify-between text-sm">
                  <span className="text-violetMuted">Progress</span>
                  <span className="font-semibold">{completedCount}/{lessons.length}</span>
                </div>
                <div className="mt-3 h-2 rounded-full bg-violetSoft">
                  <div className="h-2 rounded-full bg-violetMain transition-all" style={{ width: `${percent}%` }}></div>
                </div>
                <div className="mt-2 text-xs text-violetMuted">{percent}% complete</div>
              </div>

              <TutorPanel lesson={activeLesson} hint={activeLesson.hints[hintIndex]} onNextHint={() => setHintIndex(index => (index + 1) % activeLesson.hints.length)} />

              <div className="mt-4 min-h-0 flex-1 overflow-y-auto pr-1">
                <div className="space-y-2">
                  {lessons.map((lesson, index) => {
                    const active = lesson.id === activeLesson.id;
                    const done = progress.completed[lesson.id];
                    const unlocked = lessonUnlocked(lesson);
                    return (
                      <button
                        key={lesson.id}
                        onClick={() => selectLesson(lesson)}
                        aria-disabled={!unlocked}
                        className={`focus-ring w-full rounded-lg border p-3 text-left transition ${
                          active ? "border-violetMain bg-violetMain text-[#2b121f] shadow-soft" : unlocked ? "border-violetLine bg-violetPanel hover:bg-violetSoft" : "cursor-not-allowed border-violetLine bg-violetPanel/60 text-violetMuted opacity-60"
                        }`}
                      >
                        <div className="flex items-center justify-between gap-2">
                          <span className={`text-[11px] font-semibold uppercase tracking-[0.16em] ${active ? "text-[#2b121f]/70" : "text-violetMuted"}`}>{lesson.phase}</span>
                          <span className={`rounded px-2 py-0.5 text-[11px] ${done ? "bg-emerald-400/15 text-emerald-300" : active ? "bg-[#2b121f]/15 text-[#2b121f]" : "bg-violetSoft text-violetMuted"}`}>
                            {done ? "Done" : unlocked ? String(index + 1).padStart(2, "0") : "Lock"}
                          </span>
                        </div>
                        <div className="mt-2 text-sm font-semibold leading-5">{lesson.title}</div>
                        <div className={`mt-1 text-xs ${active ? "text-[#2b121f]/70" : "text-violetMuted"}`}>{lesson.short}</div>
                      </button>
                    );
                  })}
                </div>
              </div>

              <button onClick={resetAll} className="focus-ring mt-4 rounded-lg border border-violetLine px-3 py-2 text-sm text-violetMuted transition hover:bg-violetSoft">Reset progress</button>
            </aside>

            <main className="flex min-w-0 flex-1 flex-col">
              <header className="flex h-16 shrink-0 items-center justify-between border-b border-violetLine bg-violetPanel/90 px-4 md:px-6">
                <div className="min-w-0">
                  <div className="flex items-center gap-2 text-xs font-semibold uppercase tracking-[0.18em] text-violetMuted">
                    <span>{activeLesson.phase}</span>
                    <span className="h-1 w-1 rounded-full bg-violetLine"></span>
                    <span>Polars lesson {activeIndex + 1} of {lessons.length}</span>
                  </div>
                  <div className="truncate text-base font-semibold md:text-lg">{activeLesson.title}</div>
                </div>
                <div className="flex items-center gap-2">
                  <button onClick={resetCurrent} className="focus-ring hidden rounded-lg border border-violetLine px-3 py-2 text-sm text-violetMuted transition hover:bg-violetSoft sm:inline-flex">Clear</button>
                  <button onClick={nextLesson} aria-disabled={nextLocked} className={`focus-ring rounded-lg border border-violetLine px-3 py-2 text-sm transition ${nextLocked ? "cursor-not-allowed text-violetMuted opacity-60" : "text-violetInk hover:bg-violetSoft"}`}>Next</button>
                </div>
              </header>

              <div className="grid min-h-0 flex-1 grid-cols-1 xl:grid-cols-[minmax(360px,0.9fr)_minmax(560px,1.1fr)]">
                <section className="min-h-0 overflow-y-auto border-b border-violetLine bg-violetShell p-4 md:p-6 xl:border-b-0 xl:border-r">
                  <div className="rounded-lg border border-violetLine bg-violetPanel p-4 shadow-soft">
                    <div className="flex items-start justify-between gap-4">
                      <div>
                        <div className="text-xs font-semibold uppercase tracking-[0.18em] text-violetMain">Challenge</div>
                        <h2 className="mt-2 text-2xl font-semibold tracking-tight">{activeLesson.short}</h2>
                      </div>
                      <div className="rounded-lg border border-violetLine bg-violetSoft px-3 py-2 text-right">
                        <div className="text-xs text-violetMuted">Unlock</div>
                        <div className="text-sm font-semibold">{currentPassed ? "Passed" : "Locked"}</div>
                      </div>
                    </div>
                    <p className="mt-4 text-sm leading-6 text-violetInk">{activeLesson.prompt}</p>
                  </div>

                  <div className="mt-4 rounded-lg border border-violetLine bg-violetPanel p-4">
                    <div className="flex items-center justify-between gap-3">
                      <div>
                        <h3 className="text-sm font-semibold">{dataset.title}</h3>
                        <p className="mt-1 text-xs leading-5 text-violetMuted">{dataset.note}</p>
                      </div>
                      <span className="rounded-md bg-violetSoft px-2 py-1 text-xs text-violetMuted">{activeLesson.dataset}</span>
                    </div>
                    <pre className="mt-4 max-h-64 overflow-auto rounded-lg border border-violetLine bg-violetShell p-3 text-xs leading-5 text-violetInk">{JSON.stringify(dataset.rows, null, 2)}</pre>
                  </div>
                </section>

                <section className="flex min-h-0 flex-col bg-violetPanel">
                  <div className="flex shrink-0 items-center justify-between border-b border-violetLine px-4 py-3">
                    <div>
                      <div className="text-sm font-semibold">Polars editor</div>
                      <div className="text-xs text-violetMuted">Blank by default. No pandas in the input unless you click the spoiler.</div>
                    </div>
                    <div className="flex flex-wrap justify-end gap-2">
                      <button onClick={showPolarsAnswer} className="focus-ring rounded-lg border border-violetLine px-3 py-2 text-sm text-violetInk transition hover:bg-violetSoft">Show Polars answer</button>
                      <button onClick={spoilPandas} className="focus-ring rounded-lg border border-violetLine px-3 py-2 text-sm text-violetInk transition hover:bg-violetSoft">Spoil pandas version</button>
                      <button onClick={runLesson} className="focus-ring rounded-lg bg-violetMain px-4 py-2 text-sm font-semibold text-[#2b121f] transition hover:bg-[#ec4899]">Run</button>
                    </div>
                  </div>

                  <div className="min-h-0 flex-1 p-4">
                    <textarea
                      value={code}
                      onChange={event => setCodeByLesson(prev => ({ ...prev, [activeLesson.id]: event.target.value }))}
                      spellCheck="false"
                      placeholder="Write Polars code here."
                      className="focus-ring h-full min-h-[320px] w-full resize-none rounded-lg border border-violetLine bg-violetShell p-4 text-[14px] leading-6 text-violetInk shadow-inner outline-none placeholder:text-violetMuted/60"
                    />
                  </div>

                  <div className="grid shrink-0 grid-cols-1 border-t border-violetLine md:grid-cols-2">
                    <OutputPanel text={output} passed={progress.submissions?.[activeLesson.id]?.passed} />
                    <div className="border-t border-violetLine p-4 md:border-l md:border-t-0">
                      <div className="text-sm font-semibold">Pandas spoiler</div>
                      {progress.showPandas?.[activeLesson.id] ? (
                        <pre className="mt-3 h-40 overflow-auto whitespace-pre-wrap rounded-lg border border-violetLine bg-violetShell p-3 text-xs leading-5 text-violetInk">{activeLesson.pandasSpoiler}</pre>
                      ) : (
                        <div className="mt-3 h-40 rounded-lg border border-dashed border-violetLine bg-violetShell p-3 text-sm leading-6 text-violetMuted">Hidden. Click “Spoil pandas version” only when you want the comparison.</div>
                      )}
                    </div>
                  </div>
                </section>
              </div>
            </main>
          </div>
        </div>
      );
    }

    function TutorPanel({ lesson, hint, onNextHint }) {
      return (
        <div className="mt-4 rounded-lg border border-violetLine bg-violetPanel p-4">
          <div className="text-xs font-semibold uppercase tracking-[0.18em] text-violetMain">Tutor</div>
          <h3 className="mt-2 text-base font-semibold">What to notice</h3>
          <p className="mt-2 text-sm leading-6 text-violetMuted">{lesson.tutor}</p>
          <div className="mt-4 rounded-lg border border-violetLine bg-violetSoft/60 p-3">
            <div className="flex items-center justify-between gap-3">
              <div className="text-sm font-semibold">Hint</div>
              <button onClick={onNextHint} className="focus-ring rounded-md border border-violetLine bg-violetSoft px-2 py-1 text-xs text-violetInk">Next hint</button>
            </div>
            <p className="mt-2 text-sm leading-6 text-violetMuted">{hint}</p>
          </div>
          <div className="mt-4 text-xs leading-5 text-violetMuted">Pass rule: the checker looks for the required Polars patterns. You cannot unlock the next lesson until this one passes.</div>
        </div>
      );
    }

    function OutputPanel({ text, passed }) {
      return (
        <div className="p-4">
          <div className="flex items-center justify-between">
            <div className="text-sm font-semibold">Output</div>
            <span className={`rounded-md px-2 py-1 text-xs ${
              passed === true ? "bg-emerald-400/15 text-emerald-300" : passed === false ? "bg-amber-400/15 text-amber-300" : "bg-violetSoft text-violetMuted"
            }`}>
              {passed === true ? "Passed" : passed === false ? "Needs work" : "Ready"}
            </span>
          </div>
          <pre className="mt-3 h-40 overflow-auto whitespace-pre-wrap rounded-lg border border-violetLine bg-violetShell p-3 text-xs leading-5 text-violetInk">{text}</pre>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
